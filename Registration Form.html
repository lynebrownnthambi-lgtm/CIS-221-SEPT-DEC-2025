<!DOCTYPE html>
<html> 
    <head>
        <title> My first website</title>
    </head>
    <body>
        <form> 
            <div>
             <label for="fname">first name:</label>
             <input type="text" id="fname"placeholder="barbie"required>
            </div>
            <br>
            <div>
             <label for="lname">last name:</label>
             <input type="text" id="lname"placeholder="thumberlina"required>
            </div>
            <br>
            <div>
                <label for="pass">password:</label> 
                <input type="pasword" id="pass"name="pass"maxlength="10"required>
            </div>
            <br>
            <div>
                please input your favourite music service(s):
                <br>
                <input  type="radio"name="service" id="" value="itunes"/>iTunes
                <input  type="radio"name="service" id="" value="lastfm"/>Last.fm
                <input  type="radio"name="service" id="" value="spotify"/>Spotify 
            </div>
            <br>
            <div> 
                <label for="email">email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <Br>
            <div>
                 <label for="title">title:</label>

                 <label for="Mr.">Mr.</label>
                 <input type="radio" id="Mr."name="title"value="Mr."> 

                 <label for="Mrs.">Mrs.</label>
                 <input type="radio" id="Mrs."name="title"value="Mrs.">
            </div>
            <br>
            <div> 
             <label for="payment"> payment:</label>
             <select id="payment" name="payment">
                <option value="visa">visa</option>
                <option value="mastercard">mastercard</option>
                <option value="giftcard">giftcard</option>
             </select>   
            </div>
            <br>
            <div>
                <label for="subscribe">subscribe:</label>
                <input type="checkbox" id="subscribe"name="subscribe"
            </div>
            <div>
                <input type="reset">
            </div>
            <br>
            <div> 
                <input type="submit"
            </div>
        </form>
    </body>
</html>
